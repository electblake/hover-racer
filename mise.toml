[tasks.editor]
description = "Open Hover Racer in the Godot editor"
run = "godot --editor --path ."

[tasks.play]
description = "Launch Hover Racer"
run = "godot --path ."

[tasks.test]
description = "Import assets and run all GUT unit and integration tests"
run = [{ task = "test:import" }, { task = "test:all" }]

[tasks."test:all"]
description = "Run all discovered GUT tests"
run = "godot --headless --fixed-fps 60 --path . --log-file .godot/test-all.log --script addons/gut/gut_cmdln.gd"
run_windows = "godot_console --headless --fixed-fps 60 --path . --log-file .godot/test-all.log --script addons/gut/gut_cmdln.gd"
timeout = "120s"

[tasks."test:import"]
description = "Import Godot resources for headless tests"
run = "godot --headless --path . --import --log-file .godot/test-import.log"
run_windows = "godot_console --headless --path . --import --log-file .godot/test-import.log"
timeout = "120s"

[tasks."test:unit"]
description = "Pure thrust envelope timing and state transitions"
run = "godot --headless --fixed-fps 60 --path . --log-file .godot/test-unit.log --script addons/gut/gut_cmdln.gd -gdir=res://tests/unit"
run_windows = "godot_console --headless --fixed-fps 60 --path . --log-file .godot/test-unit.log --script addons/gut/gut_cmdln.gd -gdir=res://tests/unit"
timeout = "60s"

[tasks."test:thrust"]
description = "Authored and live vehicle tuning, thrust meter and layout"
run = "godot --headless --fixed-fps 60 --path . --log-file .godot/test-thrust.log --script addons/gut/gut_cmdln.gd -gselect=test_thrust.gd"
run_windows = "godot_console --headless --fixed-fps 60 --path . --log-file .godot/test-thrust.log --script addons/gut/gut_cmdln.gd -gselect=test_thrust.gd"
timeout = "60s"

[tasks."test:menu"]
description = "Pause menu and input isolation"
run = "godot --headless --fixed-fps 60 --path . --log-file .godot/test-menu.log --script addons/gut/gut_cmdln.gd -gselect=test_menu.gd"
run_windows = "godot_console --headless --fixed-fps 60 --path . --log-file .godot/test-menu.log --script addons/gut/gut_cmdln.gd -gselect=test_menu.gd"
timeout = "60s"

[tasks."test:controller"]
description = "Keyboard and controller handling"
run = "godot --headless --fixed-fps 60 --path . --log-file .godot/test-controller.log --script addons/gut/gut_cmdln.gd -gselect=test_controller_input.gd"
