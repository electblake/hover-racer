timeout = "60s"

[tasks."test:coast"]
description = "Neutral input and passive coasting"
run = "godot --headless --fixed-fps 60 --path . --log-file .godot/test-coast.log --script addons/gut/gut_cmdln.gd -gselect=test_neutral_coast.gd"
